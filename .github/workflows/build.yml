name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Publish
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore PredatorControlApp.slnx

    - name: Build Solution
      run: dotnet build PredatorControlApp.slnx --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test PredatorControlApp.slnx --configuration Release --no-build --verbosity normal

    - name: Publish Standalone Executable
      run: dotnet publish PredatorControlApp/PredatorControlApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

    - name: Upload Standalone Binary
      uses: actions/upload-artifact@v4
      with:
        name: PredatorControlApp-Standalone-win-x64
        path: ./publish/PredatorControlApp.exe
