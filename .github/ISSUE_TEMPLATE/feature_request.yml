name: 💡 Feature Request
description: Suggest an idea or new hardware feature for Predator Control App
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please share your idea and explain how it helps Acer Predator owners.
  - type: input
    id: laptop_model
    attributes:
      label: Laptop Model
      description: What Acer Predator model do you use?
      placeholder: e.g., Predator Helios 16, Helios 18, Triton 17X, Neo 16, etc.
    validations:
      required: false
  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: What feature would you like to see added?
      placeholder: Describe the feature clearly and simply...
    validations:
      required: true
  - type: textarea
    id: why_needed
    attributes:
      label: Why is this helpful?
      description: How does this improve your laptop experience or battery life?
      placeholder: Tell us why this would be awesome...
    validations:
      required: false
