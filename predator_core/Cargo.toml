[package]
name = "predator_core"
version = "1.5.8"
edition = "2021"

[lib]
name = "predator_core"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true

[dependencies]
realfft = { version = "3.5", default-features = false }
# rustfft's default features enable the runtime-dispatched AVX/SSE/NEON kernels.
rustfft = "6.4"
